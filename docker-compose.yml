services:
  redis:
    image: redis:8.10.1-alpine
    container_name: redis_db
    ports:
      - ${REDIS_PORT}:6379
    volumes:
      - redis_db:/data
    command: 'redis-server'

  db:
    image: postgres
    container_name: 'postgres_db'
    env_file:
      - .env.database
    ports:
      - '${POSTGRES_PORT}:5432'
    volumes:
      - data_db:/var/lib/postgresql

volumes:
  data_db:
  redis_db:
